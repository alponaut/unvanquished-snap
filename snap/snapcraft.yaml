name: unvanquished-alpo
base: core24

adopt-info: assets
icon: snap/gui/unvanquished.png

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  unvanquished:
    extensions: [gnome]
    command: usr/bin/unvanquished -pakpath $SNAP/usr/share/unvanquished/pkg
    common-id: net.unvanquished.Unvanquished
    environment:
      XDG_DATA_HOME: $SNAP_USER_COMMON
      XDG_CONFIG_HOME: $SNAP_USER_COMMON
    plugs:
      - network
      - network-bind
      - audio-playback
      - joystick
      - shmem

plugs:
  shmem:
    interface: shared-memory
    private: true

parts:
  assets:
    plugin: nil
    source: https://github.com/Unvanquished/Unvanquished.git
    source-type: git
    build-packages:
      - aria2
      - jq
    override-pull: |
      set -e
      LATEST_TAG=$(curl -s https://api.github.com/repos/Unvanquished/Unvanquished/releases/latest | jq -r .tag_name)
      craftctl default
      git checkout "$LATEST_TAG"
      craftctl set version=${LATEST_TAG#v}
    override-build: |
      cd $CRAFT_PART_SRC
      mkdir -p $CRAFT_PART_INSTALL/usr/share/unvanquished/pkg
      ./download-paks $CRAFT_PART_INSTALL/usr/share/unvanquished/pkg

      mkdir -p $CRAFT_PART_INSTALL/usr/share/metainfo/
      cp $CRAFT_PROJECT_DIR/net.unvanquished.Unvanquished.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo
      chmod 644 $CRAFT_PART_INSTALL/usr/share/metainfo/net.unvanquished.Unvanquished.metainfo.xml
      
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp $CRAFT_PROJECT_DIR/unvanquished $CRAFT_PART_INSTALL/usr/bin
      chmod 755 $CRAFT_PART_INSTALL/usr/bin/unvanquished
    parse-info:
      - usr/share/metainfo/net.unvanquished.Unvanquished.metainfo.xml
      
  libsdl:
    after: [assets]
    plugin: cmake
    source: https://github.com/libsdl-org/SDL.git
    source-type: git
    override-pull: |
      set -e
      LATEST_TAG=$(curl -s https://api.github.com/repos/libsdl-org/SDL/releases/latest | jq -r .tag_name)
      craftctl default
      git checkout "$LATEST_TAG"
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DSDL_TESTS=OFF
      - -DSDL_X11_XSCRNSAVER=OFF
      - -DSDL_PIPEWIRE=ON
      - -DSDL_PIPEWIRE_SHARED=ON
    build-packages:
      - build-essential
      - ninja-build
      - libpipewire-0.3-dev
      - libwayland-dev
      - libdecor-0-dev
      - jq

  unvanquished:
    after: [libsdl, assets]
    plugin: nil
    source: https://github.com/DaemonEngine/Daemon.git
    source-type: git
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/unvanquished
      cd $CRAFT_PART_SRC
      git checkout "unvanquished/${SNAP_VERSION}"
      cmake -H. -Bbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_TTY_CLIENT=OFF -DBUILD_SERVER=OFF -DUSE_EXTERNAL_DEPS_LIBS=FALSE -DUSE_CURSES=TRUE -DUSE_HARDENING=TRUE -DUSE_LTO=TRUE -DUSE_OPENMP=TRUE
      cmake --build build -- -j$(nproc)
      cd build
      for f in daemon nacl_loader nacl_helper_bootstrap; do
        chmod 755 $f
        cp $f $CRAFT_PART_INSTALL/usr/lib/unvanquished/
      done
      chmod 644 irt_core-*
      cp -r irt_core-* $CRAFT_PART_INSTALL/usr/lib/unvanquished/
    build-environment:
      - PYTHONPATH: /usr/lib/python3/dist-packages:$PYTHONPATH
    override-pull: |
      craftctl default
      sed -i 's/isfinite(temp)/std::isfinite(temp)/g' $CRAFT_PART_SRC/src/common/Cvar.cpp
    override-prime: |
      craftctl default
      cd $CRAFT_PART_INSTALL/usr/lib/unvanquished/
      patchelf --clear-execstack irt_core-*
    build-packages:
      - git
      - build-essential
      - cmake
      - ninja-build
      - zlib1g-dev
      - libgmp-dev
      - nettle-dev
      - libcurl4-openssl-dev
      - libglew-dev
      - libpng-dev
      - libjpeg-dev
      - libwebp-dev
      - libopenal-dev
      - libogg-dev
      - libvorbis-dev
      - libopus-dev
      - libopusfile-dev
      - libdecor-0-dev
      - patchelf
      - libfreetype-dev
      - libncurses-dev
      - python3
      - python3-yaml
      - python3-jinja2
    stage-packages:
      - zlib1g
      - libgmp10
      - libcurl4t64
      - libpng16-16t64
      - libnettle8t64
      - libopenal1
      - libopusfile0
      - libjpeg8
      - libglew2.2
      - libwebp7
      - libopus0
      - libogg0
      - libvorbis0a
      - libdecor-0-0
      - libfreetype6
      - libncurses6

  cleanup:
    after:
      - unvanquished
      - libsdl
      - assets
    plugin: nil
    build-snaps:
      - core24
      - gnome-46-2404
      - mesa-2404
    override-prime: |
      set -eux
      for snap in "core24" "gnome-46-2404" "mesa-2404"; do
          cd "/snap/$snap/current" && find . -type f,l -exec rm -rf "$CRAFT_PRIME/{}" \;
      done

