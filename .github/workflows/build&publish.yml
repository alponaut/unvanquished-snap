name: Rebuild and publish snap (multiarch)

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main
      - edge
  workflow_dispatch: {} 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "channel=candidate" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/edge" ]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
